name: genz_discontinuous
dim: 2
corrector: 1e-10

fn:
  _target_: targets.genz.GenzDiscontinuous
  dim: ${target.dim}
  a: 5.0
  u: 0.5
  corrector: ${target.corrector}

# Experiment-specific algorithm parameters
# !!! Default Parameters; Currently not tuned for this experiment !!!
# ----------------------------------------

pis: # Path Integral Sampler
  max_diffusion: 1.
  step_size: 1e-3

rds:
  step_size: 1e-3
  min_diffusion: 0.001
  max_diffusion: 1.0

all: # Parameters that are shared between all algorithms
  batch_size: 512
  iters: 4000
  milestones: [2000]
  num_steps: 64
  use_lp: False
  num_hid: 256
